<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login Fixture — Extension Autofill Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f9f9f9; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        input { padding: 0.5rem; width: 240px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.5rem 1rem; background: #3bb7f9; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Login Fixture</h1>
    <form id="login-form" method="post" action="/login">
        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" autocomplete="username" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>
        <div class="form-group">
            <label for="totp">Verification Code</label>
            <input type="text" id="totp" name="totp" maxlength="6" inputmode="numeric" pattern="\d{6}" placeholder="000000" />
        </div>
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
