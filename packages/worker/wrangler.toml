name = "padloc-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
account_id = "25bb5f8d9ec4a36106f0ff6b519133b1"

[alias]
"@padloc/locale/src/translate" = "./node_modules/@padloc/locale/src/translate.ts"
"@padloc/core/src" = "./node_modules/@padloc/core/src"
"@padloc/locale/src" = "./node_modules/@padloc/locale/src"

[[migrations]]
tag = "v1"
new_classes = ["AccountLockDO"]

# Top-level D1 migration config (used for local dev)
[[d1_databases]]
binding = "DB"
database_name = "padloc-dev"
database_id = "e2bf5126-0913-48a1-831d-531606f398c9"
migrations_dir = "migrations"

[env.dev]
name = "padloc-worker-dev"

[env.dev.vars]
EMAIL_VERIFY_ON_SIGNUP = "false"
EMAIL_BACKEND = "mock"
ALLOW_ORIGIN = "*"
CLIENT_URL = "http://localhost:3000"

[[env.dev.kv_namespaces]]
binding = "EMAIL_KV"
id = "PADLOC_EMAIL_DEV"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "padloc-dev"
database_id = "e2bf5126-0913-48a1-831d-531606f398c9"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-dev"

[[env.dev.kv_namespaces]]
binding = "HINTS"
id = "PADLOC_HINTS_DEV"

[[env.dev.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"

[env.preview]
name = "padloc-worker-preview"

[env.preview.vars]
EMAIL_BACKEND = "mock"
ALLOW_ORIGIN = "*"
CLIENT_URL = "http://localhost:3000"

[[env.preview.kv_namespaces]]
binding = "EMAIL_KV"
id = "9dbdc747eeb4472681e9f081eb9e8269"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "padloc-preview"
database_id = "426f172f-8117-48c6-849b-1b26901b89e6"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-preview"

[[env.preview.kv_namespaces]]
binding = "HINTS"
id = "f868962679c74a33886cff584f37d18d"

[[env.preview.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"

[env.staging]
name = "padloc-worker-staging"
routes = [{ pattern = "api-pad-staging.ch5.me/*", zone_name = "ch5.me" }]

[env.staging.vars]
ALLOW_ORIGIN = "https://pad-staging.ch5.me"
CLIENT_URL = "https://pad-staging.ch5.me"

[[env.staging.kv_namespaces]]
binding = "EMAIL_KV"
id = "3a1d6fbb6d9c46fc968ff098c808a3d1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "padloc-staging"
database_id = "b56e6d4b-1ae1-40c4-8ffb-38f0ee4b95a7"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-staging"

[[env.staging.kv_namespaces]]
binding = "HINTS"
id = "473fbdf54902430db811ef50bd57ce2e"

[[env.staging.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"

[env.production]
name = "padloc-worker"
routes = [{ pattern = "api-pad.ch5.me/*", zone_name = "ch5.me" }]

[env.production.vars]
ALLOW_ORIGIN = "https://pad.ch5.me"
CLIENT_URL = "https://pad.ch5.me"

[[env.production.kv_namespaces]]
binding = "EMAIL_KV"
id = "0231a8c22d1b4a54a3c4b9e72a68165d"

[[env.production.d1_databases]]
binding = "DB"
database_name = "padloc-prod"
database_id = "f443b7e5-861e-4a4f-9c67-1a33acf5677d"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-prod"

[[env.production.kv_namespaces]]
binding = "HINTS"
id = "0abcb21cdf5541b9a7f8c2c35e922a7b"

[[env.production.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"
