[package]
name = "elf-vault"
version = "4.3.0"
description = "Elf Vault"
authors = [ "Martin Kleinschrodt <martin@maklesoft.com>" ]
license = "GPL-3.0"
repository = "https://github.com/padloc/padloc"
default-run = "elf-vault"
edition = "2021"
build = "src/build.rs"

[build-dependencies.tauri-build]
version = "1.2.1"
features = [ ]

[dependencies.tauri]
version = "1.2.3"
features = [ "updater" ]

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
