name: Branch Regression

on:
    workflow_dispatch:
    push:
        branches-ignore:
            - main

jobs:
    workflow-yaml:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Validate branch workflows
              run: |
                  set -euo pipefail
                  version=1.7.7
                  archive="actionlint_${version}_linux_amd64.tar.gz"
                  checksums="actionlint_${version}_checksums.txt"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/${checksums}"
                  grep " ${archive}$" "$checksums" | sha256sum -c -
                  tar -xzf "$archive" actionlint
                  ./actionlint -config-file .github/actionlint.yaml -no-color \
                    .forgejo/workflows/branch-regression.yml \
                    .forgejo/workflows/deploy-staging.yml \
                    .forgejo/workflows/passkey-provider.yml \
                    .forgejo/workflows/run-tests.yml

    node-regression:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  node node_modules/lerna/cli.js bootstrap
            - name: Test Worker and extension packages
              run: |
                  npm --prefix packages/worker run test:ci
                  npm --prefix packages/extension test
            - name: Build production extension and unsigned archive
              env:
                  PL_BUILD_ENV: production
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
              run: |
                  npm run web-extension:build
                  npm --prefix packages/extension run preflight:dist
                  if find packages/extension/dist -type f -name '*.map' -print -quit | grep -q .; then
                    echo "Production extension contains source maps." >&2
                    exit 1
                  fi
                  scripts/package-web-extension.sh \
                    --extension-dir packages/extension/dist \
                    --zip-file packages/extension/padloc-unsigned.zip

    cordova-android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "11"
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install Android SDK
              run: scripts/ci-install-android-sdk.sh
            - name: Install dependencies
              run: env -u ESBUILD_BINARY_PATH npm ci
            - name: Build unsigned debug APK
              env:
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
              run: npm run cordova:build:android

    desktop-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install native build dependencies
              run: scripts/ci-apt-install.sh libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
            - name: Install Rust
              run: |
                  set -euo pipefail
                  curl -fsSf --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
                  echo "$HOME/.cargo/bin" >> "${FORGEJO_PATH:-${GITHUB_PATH}}"
            - name: Install dependencies
              run: env -u ESBUILD_BINARY_PATH npm ci
            - name: Build unsigned unpacked Electron app
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  PL_PWA_URL: https://pad-staging.ch5.me
              run: npm --prefix packages/electron run build:ci
            - name: Check Tauri Rust application
              env:
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
                  PL_PWA_URL: https://pad-staging.ch5.me
              run: npm --prefix packages/tauri run check:ci

    docker-build:
        runs-on: hq-writer
        steps:
            - uses: actions/checkout@v4
            - name: Build server image without pushing
              run: docker build --file Dockerfile-server --tag padloc-server:${{ github.sha }} .
            - name: Build PWA image without pushing
              run: docker build --file Dockerfile-pwa --tag padloc-pwa:${{ github.sha }} .
