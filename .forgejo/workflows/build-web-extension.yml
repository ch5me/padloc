name: Build Web Extension

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                default: "Local"
            build:
                type: string
                description: "Build number (int, 3 max digits)"
                default: "0"
                required: true

    push:
        branches:
            - "main"
            - "feature/**"
            - "fix/**"
        paths:
            - ".forgejo/workflows/build-web-extension.yml"
            - "package.json"
            - "package-lock.json"
            - "packages/app/**"
            - "packages/core/**"
            - "packages/extension/**"
            - "packages/locale/**"
            - "packages/worker/package.json"
            - "packages/worker/package-lock.json"
            - "scripts/build-web-extension.cjs"
            - "scripts/package-web-extension.sh"
            - "assets/**"

jobs:
    archive:
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment || 'Local' }}
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: "20"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0 web-ext@6.6.0
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Build
              env:
                  RELEASE_BUILD: ${{ github.event.inputs.build || '0' }}
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL || 'https://api-pad-staging.ch5.me' }}
                  PL_BUILD_ENV: ${{ secrets.PL_BUILD_ENV }}
              run: npm run web-extension:build
            - name: Install Playwright browsers
              run: |
                  cd packages/extension
                  npx playwright install chromium --with-deps
            - name: Run extension runtime smoke tests
              run: npm run --prefix packages/extension test:harness
            - name: Build ZIP for unsigned Chrome/Edge/Firefox Extension
              run: scripts/package-web-extension.sh --extension-dir packages/extension/dist --zip-file packages/extension/padloc.zip
            # - name: Sign for Firefox
            #   if: github.event.inputs.environment == 'Beta' || github.event.inputs.environment == 'Production'
            #   run: cd packages/extension/dist && web-ext sign --id="${{ secrets.PL_WEB_EXTENSION_FIREFOX_ID }}" --channel=unlisted --api-key=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_KEY }} --api-secret=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_SECRET }}
            # - name: Archive Signed Web Extension (Firefox)
            #   if: github.event.inputs.environment == 'Beta' || github.event.inputs.environment == 'Production'
            #   uses: actions/upload-artifact@v2
            #   with:
            #       name: padloc-web-extension-${{ github.sha }}-signed.xpi
            #       path: packages/extension/dist/web-ext-artifacts/*.xpi
            #       if-no-files-found: error
            - name: Archive Unsigned Web Extension (Chrome/Edge/Firefox)
              if: github.event_name == 'workflow_dispatch'
              continue-on-error: true
              uses: actions/upload-artifact@v2
              with:
                  name: padloc-web-extension-${{ github.sha }}-unsigned.zip
                  path: packages/extension/padloc.zip
                  if-no-files-found: error
            - name: Sign for Chrome/Edge
              if: github.event_name == 'workflow_dispatch'
              id: sign_chrome
              env:
                  PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY: ${{ secrets.PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY }}
              run: |
                  output_file="${FORGEJO_OUTPUT:-${GITHUB_OUTPUT:-}}"
                  if [ -z "$output_file" ]; then
                    echo "No workflow output file is available for signing metadata." >&2
                    exit 1
                  fi
                  if [ -z "${PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY:-}" ]; then
                    echo "signed=false" >> "$output_file"
                    echo "Skipping signed Chrome/Edge CRX; PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY is not set."
                    exit 0
                  fi
                  printf '%s' "$PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY" > "$RUNNER_TEMP/chrome-extension.pem"
                  scripts/package-chrome-crx.sh \
                    --extension-dir packages/extension/dist \
                    --crx-file packages/extension/padloc-signed.crx \
                    --private-key-file "$RUNNER_TEMP/chrome-extension.pem"
                  echo "signed=true" >> "$output_file"
            - name: Archive Signed Web Extension (Chrome/Edge)
              if: steps.sign_chrome.outputs.signed == 'true'
              continue-on-error: true
              uses: actions/upload-artifact@v2
              with:
                  name: padloc-web-extension-${{ github.sha }}-signed.crx
                  path: packages/extension/padloc-signed.crx
                  if-no-files-found: error
