name: Run Tests

on:
    push:
        paths:
            - ".forgejo/workflows/**"
            - "Dockerfile*"
            - "cypress/**"
            - "config/**"
            - "docs/passkey-provider-*.md"
            - "scripts/**"
            - "package.json"
            - "package-lock.json"
            - "packages/*/package.json"
            - "packages/*/package-lock.json"
            - "packages/**"
            - "assets/**"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      ~/.nvm
                      node_modules
                      packages/app/node_modules
                      packages/cordova/node_modules
                      packages/core/node_modules
                      packages/electron/node_modules
                      packages/extension/node_modules
                      packages/locale/node_modules
                      packages/pwa/node_modules
                      packages/server/node_modules
                      packages/tauri/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  bash scripts/ci-bootstrap-workspaces.sh
            - name: Run changed-source prettier check
              run: npm run prettier:check:changed
            - name: Run translation checks
              run: |
                  npm run locale:extract
                  if [ "$(git status --porcelain | wc -l)" -ne "0" ]; then
                    echo "Missing translations detected."
                    exit 1
                  fi
            - name: Validate runtime contract
              run: npm run runtime-config:check
            - name: Run pwa test build
              run: npm run pwa:build
            - name: Run web extension test build
              run: npm run web-extension:build
              env:
                  PL_BUILD_ENV: production
            - name: Test starting zero-config server
              run: npm run server:start-dry
            - name: Run extension and Worker tests
              run: |
                  npm --prefix packages/extension test
                  npm --prefix packages/worker test
            # - name: Run e2e tests
            #   run: npm run test:e2e

    extension-runtime:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      packages/extension/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  bash scripts/ci-bootstrap-workspaces.sh
            - name: Install Playwright Chromium
              run: |
                  cd packages/extension
                  npx playwright install chromium --with-deps
            - name: Build and run extension runtime smoke tests
              run: npm run test:extension
              env:
                  PL_BUILD_ENV: production
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
                  PL_PASSKEY_DIAGNOSTICS: "true"
