name: Run Tests

on:
    push:
        branches:
            - main
        paths:
            - "package.json"
            - "package-lock.json"
            - "packages/extension/**"
            - "packages/core/**"
            - "packages/app/**"
            - "packages/locale/**"
            - "packages/worker/package.json"
            - "packages/worker/package-lock.json"
            - "assets/**"
            - "scripts/build-web-extension.cjs"
    pull_request:
        paths:
            - "package.json"
            - "package-lock.json"
            - "packages/extension/**"
            - "packages/core/**"
            - "packages/app/**"
            - "packages/locale/**"
            - "packages/worker/package.json"
            - "packages/worker/package-lock.json"
            - "assets/**"
            - "scripts/build-web-extension.cjs"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - uses: actions/cache@v3
              with:
                  path: |
                      ~/.npm
                      ~/.nvm
                      node_modules
                      packages/app/node_modules
                      packages/cordova/node_modules
                      packages/core/node_modules
                      packages/electron/node_modules
                      packages/extension/node_modules
                      packages/locale/node_modules
                      packages/pwa/node_modules
                      packages/server/node_modules
                      packages/tauri/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Run prettier check
              run: npm run prettier:check
            - name: Run translation checks
              run: |
                  npm run locale:extract
                  if [ $(git status --porcelain | wc -l) -ne "0" ]; then
                    echo "Missing translations detected."
                    exit 1
                  fi
            - name: Validate runtime contract
              run: npm run runtime-config:check
            - name: Run pwa test build
              run: npm run pwa:build
            - name: Run web extension test build
              run: npm run web-extension:build
            - name: Test starting zero-config server
              run: npm run server:start-dry
            - name: Run tests
              run: npm test
            # - name: Run e2e tests
            #   run: npm run test:e2e

    extension-runtime:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - uses: actions/cache@v3
              with:
                  path: |
                      node_modules
                      packages/extension/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Install Playwright Chromium
              run: |
                  cd packages/extension
                  npx playwright install chromium --with-deps
            - name: Build and run extension runtime smoke tests
              run: npm run test:extension
