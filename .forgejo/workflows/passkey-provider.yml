name: Passkey Provider

on:
    push:
        paths:
            - ".forgejo/workflows/passkey-provider.yml"
            - "package.json"
            - "package-lock.json"
            - "config/**"
            - "packages/core/**"
            - "packages/extension/**"
            - "packages/macos/**"
            - "packages/worker/**"
            - "scripts/proof-lanes/proof-passkeys.sh"
            - "scripts/proof-lanes/proof-native-injected.sh"
            - "scripts/preflight-web-extension-*.cjs"
            - "docs/passkey-provider-*.md"
    workflow_dispatch:
        inputs:
            lane:
                description: "signed-injected, hardware, public-canary, or google-canary"
                required: true
                default: "signed-injected"
    schedule:
        - cron: "0 16 * * 1"

concurrency:
    group: passkey-provider-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pr-linux:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci --ignore-scripts && node node_modules/lerna/cli.js bootstrap
            - run: cd packages/extension && npx playwright install chromium --with-deps
            - run: npm run proof:passkeys:pr

    macos-contract:
        if: github.event_name == 'push'
        runs-on: macos-arm64
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - run: npm --prefix packages/extension ci --ignore-scripts
            - run: bash scripts/proof-lanes/proof-passkeys.sh --macos-contract

    signed-injected:
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'signed-injected'
        runs-on: macos-arm64
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci --ignore-scripts && node node_modules/lerna/cli.js bootstrap
            - run: npm run passkeys:native:test-injected

    hardware-in-loop:
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'hardware')
        runs-on: macos-arm64
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - run: npm ci --ignore-scripts && node node_modules/lerna/cli.js bootstrap
            - run: npm run passkeys:native:install
            - run: PADLOC_NATIVE_SYSTEM_E2E=1 PADLOC_NATIVE_SYSTEM_TIMEOUT_MS=900000 npm run proof:passkeys:system

    optional-canary:
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.lane == 'public-canary' || github.event.inputs.lane == 'google-canary')
        runs-on: macos-arm64
        steps:
            - run: echo "Canaries require a separately authorized attended procedure; no credential or account data is supplied by CI."
