name: Public Release Staging

on:
    push:
        branches: [main]
        paths:
            - ".forgejo/workflows/public-release-staging.yml"
            - "config/release-manifest.schema.json"
            - "config/platform-support.json"
            - "scripts/release/**"
            - "scripts/build-web-extension.cjs"
            - "scripts/package-web-extension.sh"
            - "packages/extension/**"
            - "packages/app/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "package.json"
            - "package-lock.json"
    workflow_dispatch:

concurrency:
    group: public-release-staging
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Verify exact current main
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin main
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  bash scripts/ci-bootstrap-workspaces.sh
            - name: Build and verify unsigned staging extension
              env:
                  PL_BUILD_ENV: production
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
              run: |
                  npm --prefix packages/extension test
                  npm run web-extension:build
                  npm --prefix packages/extension run preflight:dist
                  if find packages/extension/dist -type f -name '*.map' -print -quit | grep -q .; then exit 1; fi
                  version=$(node -p "require('./package.json').version")
                  scripts/package-web-extension.sh --extension-dir packages/extension/dist --zip-file "ch5-auth-${version}-web-extension-unsigned.zip"
            - name: Generate manifest and release-note draft
              env:
                  RELEASE_CHANNEL: staging
                  RELEASE_VERSION: ${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}
                  RELEASE_SHA: ${{ github.sha }}
                  RELEASE_TAG: release-v${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}-${{ github.sha }}
                  RELEASE_ASSET: ch5-auth-${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}-web-extension-unsigned.zip
                  RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}
                  RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  RELEASE_BUILD: ${{ github.run_number }}
              run: |
                  npm run release:manifest:build
                  npm run release:manifest:validate -- manifest.json
                  npm run release:notes
            - name: Publish immutable Forgejo release
              env:
                  FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: release-v${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}-${{ github.sha }}
                  VERSION: ${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}
              run: bash scripts/release/publish-forgejo.sh immutable manifest.json RELEASE_NOTES.md "ch5-auth-${VERSION}-web-extension-unsigned.zip"
            - name: Update staging channel pointer
              env:
                  FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/release/publish-forgejo.sh pointer manifest.json
            - name: Public download canary
              env:
                  TAG: release-v${{ vars.CH5_AUTH_RELEASE_VERSION || '4.3.0' }}-${{ github.sha }}
              run: npm run release:canary -- "${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/manifest.json"
