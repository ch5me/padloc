    release_cordova:
        name: "Release Cordova apps"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_BUILD: ${{ forgejo.event.inputs.build || '0' }}
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
            PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}

        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, ubuntu-latest]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-java@v3
              if: matrix.platform == 'ubuntu-latest'
              with:
                  distribution: "adopt"
                  java-version: "11"
            - name: Install Gradle 7.2
              if: matrix.platform == 'ubuntu-latest'
              shell: bash
              run: |
                  set -euo pipefail
                  gradle_version="7.2"
                  gradle_home="$RUNNER_TEMP/gradle-${gradle_version}"
                  gradle_zip="$RUNNER_TEMP/gradle-${gradle_version}-bin.zip"

                  curl -fsSL "https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip" -o "$gradle_zip"
                  unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
                  echo "GRADLE_HOME=$gradle_home" >> "$FORGEJO_ENV"
                  echo "$gradle_home/bin" >> "$FORGEJO_PATH"
                  "$gradle_home/bin/gradle" --version
            - uses: android-actions/setup-android@v2
              if: matrix.platform == 'ubuntu-latest'
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            # - name: Install coreutils
            #   if: matrix.platform == 'macos-latest'
            #   run: |
            #       brew install coreutils
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - name: Create android-upload-key.keystore
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/cordova
                  echo '${{ secrets.PL_ANDROID_UPLOAD_KEY_BASE64}}' > android-upload-key.keystore.txt
                  base64 -d android-upload-key.keystore.txt > android-upload-key.keystore
                  rm -f android-upload-key.keystore.txt
            - name: Build Android
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/cordova
                  npm run prepare-build
                  ./node_modules/.bin/cordova build android --release -- --packageType=apk --keystore=./android-upload-key.keystore --storePassword='${{ secrets.PL_ANDROID_STORE_PASSWORD }}' --alias=${{ secrets.PL_ANDROID_KEYSTORE_ALIAS }} --password='${{ secrets.PL_ANDROID_STORE_PASSWORD }}'
            # - name: Install the Apple certificate and provisioning profile
            #   if: matrix.platform == 'macos-latest'
            #   env:
            #       PL_IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.PL_IOS_DISTRIBUTION_CERT_BASE64 }}
            #       PL_IOS_DEVELOPMENT_CERT_BASE64: ${{ secrets.PL_IOS_DEVELOPMENT_CERT_BASE64 }}
            #       PL_IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.PL_IOS_DISTRIBUTION_CERT_PASSWORD }}
            #       PL_IOS_PROVISION_PROFILE_BASE64: ${{ secrets.PL_IOS_PROVISION_PROFILE_BASE64 }}
            #       PL_IOS_DEV_PROVISION_PROFILE_BASE64: ${{ secrets.PL_IOS_DEV_PROVISION_PROFILE_BASE64 }}
            #       PL_IOS_KEYCHAIN_PASSWORD: "new-password-does-not-matter"
            #   run: |
            #       # create variables
            #       DIST_CERT_PATH=$RUNNER_TEMP/distribution_certificate.p12
            #       DEV_CERT_PATH=$RUNNER_TEMP/development_certificate.p12
            #       DIST_PP_PATH=$RUNNER_TEMP/dist_pp.mobileprovision
            #       DEV_PP_PATH=$RUNNER_TEMP/dev_pp.mobileprovision
            #       KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            #       # import certificate and provisioning profile from secrets
            #       echo -n "$PL_IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode --output $DIST_CERT_PATH
            #       echo -n "$PL_IOS_DEVELOPMENT_CERT_BASE64" | base64 --decode --output $DEV_CERT_PATH
            #       echo -n "$PL_IOS_PROVISION_PROFILE_BASE64" | base64 --decode --output $DIST_PP_PATH
            #       echo -n "$PL_IOS_DEV_PROVISION_PROFILE_BASE64" | base64 --decode --output $DEV_PP_PATH

            #       # create temporary keychain
            #       security create-keychain -p "$PL_IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            #       security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            #       security unlock-keychain -p "$PL_IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            #       # import certificate to keychain
            #       security import $DIST_CERT_PATH -P "$PL_IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            #       security import $DEV_CERT_PATH -P "$PL_IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            #       security list-keychain -d user -s $KEYCHAIN_PATH
            #       security set-key-partition-list -S apple-tool:,apple: -s -k "$PL_IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            #       # apply provisioning profile
            #       mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            #       cp $DIST_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
            #       cp $DEV_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
            # - name: Setup Xcode
            #   uses: maxim-lobanov/setup-xcode@v1
            #   if: matrix.platform == 'macos-latest'
            #   with:
            #       xcode-version: "13.2.1"
            # - name: Build iOS
            #   if: matrix.platform == 'macos-latest'
            #   run: |
            #       cd packages/cordova
            #       npm run prepare-build
            #       npm run patch-ios
            #       ./node_modules/.bin/cordova build ios --release --device --packageType=app-store --codeSignIdentity="${{ secrets.PL_IOS_CODE_SIGN_IDENTITY }}" --developmentTeam="${{ secrets.PL_IOS_DEVELOPMENT_TEAM }}"
            - name: Upload Signed APK
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/cordova/platforms/android/app/build/outputs/apk/release/app-release.apk
                  RELEASE_ASSET_NAME: padloc_${{ env.PL_VENDOR_VERSION }}_android.apk
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            # iOS release upload disabled until App Store signing is restored.
            #       prerelease: true
            - name: Generate checksum (apk)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/cordova/platforms/android/app/build/outputs/apk/release
                  sha256sum app-release.apk > sha256sum-apk.txt
            - name: Upload checksum (apk)
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/cordova/platforms/android/app/build/outputs/apk/release/sha256sum-apk.txt
                  RELEASE_ASSET_NAME: sha256sum-apk.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            # - name: Generate checksum (ipa)
            #   if: matrix.platform == 'macos-latest'
            #   run: |
            #       cd packages/cordova/platforms/ios/build/device
            #       sha256sum Padloc.ipa > sha256sum-ipa.txt
            # iOS checksum upload disabled until App Store signing is restored.
            #       prerelease: true
