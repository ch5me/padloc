    release_web_checksums:
        name: "Release web checksums"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - name: Build
              run: |
                  npm run pwa:build
              env:
                  PL_PWA_URL: ${{ secrets.PL_PWA_URL }}
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
            - name: Generate pwa.tar.gz
              run: |
                  cd packages/pwa/dist
                  tar -czf ../pwa.tar.gz *
            - name: Upload pwa.tar.gz
              env:
                  RELEASE_ASSET_FILE: packages/pwa/pwa.tar.gz
                  RELEASE_ASSET_NAME: padloc_${{ env.PL_VENDOR_VERSION }}_pwa.tar.gz
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksums
              run: |
                  cd packages/pwa/dist
                  find . -type f ! -name "sha256sums-web.txt" -exec sha256sum {} > sha256sums-web.txt \;
            - name: Upload checksums
              env:
                  RELEASE_ASSET_FILE: packages/pwa/dist/sha256sums-web.txt
                  RELEASE_ASSET_NAME: sha256sums-web.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Upload CSP parser
              env:
                  RELEASE_ASSET_FILE: docs/checksums/web/parse-csp.ts
                  RELEASE_ASSET_NAME: parse-csp.ts
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash

    update_dockerhub:
        name: "Update DockerHub"
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image (server)
              uses: docker/build-push-action@v3
              with:
                  push: true
                  tags: padloc/server:v${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
                  file: Dockerfile-server

            - name: Build and push Docker image (pwa)
              uses: docker/build-push-action@v3
              with:
                  push: true
                  tags: padloc/pwa:v${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
                  file: Dockerfile-pwa

    update_docs:
        name: "Update Docs"
        needs: release_tauri
        runs-on: ubuntu-latest
        env:
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
            DOCS_FORGEJO_REPO: ${{ secrets.DOCS_FORGEJO_REPO }}
            DOCS_FORGEJO_TOKEN: ${{ secrets.DOCS_FORGEJO_TOKEN }}
        steps:
            - name: Update docs download URLs
              if: forgejo.event.inputs.environment == 'Production'
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${DOCS_FORGEJO_REPO:-}" ] || [ -z "${DOCS_FORGEJO_TOKEN:-}" ]; then
                      echo "Skipping docs update: DOCS_FORGEJO_REPO or DOCS_FORGEJO_TOKEN unset"
                      exit 0
                  fi
                  curl -fsS --request POST \
                    --url "${CH5_FORGEJO_API_URL}/repos/${DOCS_FORGEJO_REPO}/actions/workflows/update-downloads-urls.yml/dispatches" \
                    --header "Authorization: token ${DOCS_FORGEJO_TOKEN}" \
                    --header 'Content-Type: application/json' \
                    --data '{
                        "ref": "main",
                        "inputs": {
                            "version": "${{ env.PL_VENDOR_VERSION }}"
                        }
                    }'
            - name: Sleep for 1min
              if: forgejo.event.inputs.environment == 'Production'
              run: sleep 60s
              shell: bash
            - name: Rebuild docs page
              if: forgejo.event.inputs.environment == 'Production'
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${DOCS_FORGEJO_REPO:-}" ] || [ -z "${DOCS_FORGEJO_TOKEN:-}" ]; then
                      echo "Skipping docs deploy: DOCS_FORGEJO_REPO or DOCS_FORGEJO_TOKEN unset"
                      exit 0
                  fi
                  curl -fsS --request POST \
                    --url "${CH5_FORGEJO_API_URL}/repos/${DOCS_FORGEJO_REPO}/actions/workflows/deploy.yml/dispatches" \
                    --header "Authorization: token ${DOCS_FORGEJO_TOKEN}" \
                    --header 'Content-Type: application/json' \
                    --data '{
                        "ref": "main",
                        "inputs": {}
                    }'
