name: Publish Release

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                default: "Beta"
            vendor_version:
                type: string
                description: "Vendor Version (semver) for the release -- what will be visible."
                default: "0.0.1"
                required: true
            build:
                type: string
                description: "Build number (int, 3 max digits) for the release."
                default: "0"
                required: true

env:
    CH5_FORGEJO_API_URL: ${{ forgejo.server_url }}/api/v1
    CH5_FORGEJO_REPOSITORY: ${{ forgejo.repository }}

jobs:
    create_release_tag:
        name: "Create release tag"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        env:
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
            PL_VENDOR_BASE_URL: "${{ forgejo.server_url }}/${{ forgejo.repository }}"

        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create_release.outputs.id }}
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Build tauri-update.json
              run: cd packages/tauri && node generate-tauri-update-file.js
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - name: Create release and add tauri-update.json
              id: create_release
              shell: bash
              run: |
                  set -euo pipefail
                  tag="v${{ env.PL_VENDOR_VERSION }}"
                  payload=$(mktemp)
                  response=$(mktemp)
                  node > "$payload" <<NODE_JSON
                  const payload = {
                      tag_name: process.env.RELEASE_TAG,
                      target_commitish: process.env.RELEASE_TARGET,
                      name: process.env.RELEASE_TAG,
                      body: process.env.RELEASE_TAG,
                      prerelease: true,
                      draft: false,
                  };
                  process.stdout.write(JSON.stringify(payload));
                  NODE_JSON
                  status=$(curl -sS --output "$response" --write-out "%{http_code}" \
                      --request POST \
                      --header "Authorization: token ${FORGEJO_TOKEN}" \
                      --header "Content-Type: application/json" \
                      --data @"$payload" \
                      "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases")
                  if [ "$status" = "409" ]; then
                      curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/tags/${tag}" \
                          > "$response"
                  elif [[ ! "$status" =~ ^2 ]]; then
                      cat "$response" >&2
                      exit 1
                  fi
                  release_id=$(node -e 'const fs = require("fs"); const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!release.id) process.exit(1); process.stdout.write(String(release.id));' "$response")
                  echo "id=${release_id}" >> "$FORGEJO_OUTPUT"
                  RELEASE_ID="$release_id" RELEASE_ASSET_FILE="packages/tauri/tauri-update.json" RELEASE_ASSET_NAME="tauri-update.json" "$RUNNER_TEMP/upload-forgejo-release-asset"
              env:
                  RELEASE_TAG: v${{ env.PL_VENDOR_VERSION }}
                  RELEASE_TARGET: ${{ forgejo.sha }}

    release_web_extension:
        name: "Release web extension"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_BUILD: ${{ forgejo.event.inputs.build || '0' }}
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0 web-ext@6.6.0
                  npm ci
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - name: Build
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  PL_BUILD_ENV: ${{ secrets.PL_BUILD_ENV }}
              run: npm run web-extension:build
            # - name: Sign for Firefox
            #   run: cd packages/extension/dist && web-ext sign --id="${{ secrets.PL_WEB_EXTENSION_FIREFOX_ID }}" --channel=unlisted --api-key=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_KEY }} --api-secret=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_SECRET }}
            # Firefox release upload disabled until signing is restored.
            - name: Pack for Chrome/Edge Extension
              run: scripts/package-web-extension.sh --extension-dir packages/extension/dist --zip-file packages/extension/padloc.zip
            - name: Upload Unsigned Web Extension (Chrome/Edge)
              env:
                  RELEASE_ASSET_FILE: packages/extension/padloc.zip
                  RELEASE_ASSET_NAME: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_unsigned.zip
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Sign for Chrome/Edge
              id: sign_chrome
              env:
                  PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY: ${{ secrets.PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY }}
              run: |
                  if [ -z "${PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY:-}" ]; then
                    echo "signed=false" >> "$FORGEJO_OUTPUT"
                    echo "Skipping signed Chrome/Edge CRX; PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY is not set."
                    exit 0
                  fi
                  printf '%s' "$PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY" > "$RUNNER_TEMP/chrome-extension.pem"
                  scripts/package-chrome-crx.sh \
                    --extension-dir packages/extension/dist \
                    --crx-file packages/extension/padloc-signed.crx \
                    --private-key-file "$RUNNER_TEMP/chrome-extension.pem"
                  echo "signed=true" >> "$FORGEJO_OUTPUT"
            - name: Upload Signed Web Extension (Chrome/Edge)
              if: steps.sign_chrome.outputs.signed == 'true'
              env:
                  RELEASE_ASSET_FILE: packages/extension/padloc-signed.crx
                  RELEASE_ASSET_NAME: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_chrome.crx
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            # - name: Generate checksum (xpi)
            #   run: |
            #       cd packages/extension/dist/web-ext-artifacts
            #       sha256sum padloc*.xpi > sha256sum-xpi.txt
            # Firefox checksum upload disabled until signing is restored.
            - name: Generate checksum (crx)
              if: steps.sign_chrome.outputs.signed == 'true'
              run: |
                  cd packages/extension
                  sha256sum padloc-signed.crx > sha256sum-crx.txt
            - name: Upload checksum (crx)
              if: steps.sign_chrome.outputs.signed == 'true'
              env:
                  RELEASE_ASSET_FILE: packages/extension/sha256sum-crx.txt
                  RELEASE_ASSET_NAME: sha256sum-crx.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash

    release_tauri:
        name: "Release Tauri apps"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}

        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - name: Install Rust stable
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
            - name: Install webkit2gtk (ubuntu only)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y webkit2gtk-4.0
            - name: Install coreutils
              if: matrix.platform == 'macos-latest'
              run: |
                  brew install coreutils
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - uses: tauri-apps/tauri-action@v0.3.1
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  ENABLE_CODE_SIGNING: true
                  APPLE_CERTIFICATE: ${{ secrets.PL_MACOS_SIGNING_CERT_BASE64 }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PL_MACOS_SIGNING_CERT_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.PL_MACOS_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.PL_MACOS_NOTARIZE_APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.PL_MACOS_NOTARIZE_PASSWORD }}
              with:
                  projectPath: packages/tauri
            - name: Upload AppImage
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/tauri/src-tauri/target/release/bundle/appimage
                  sha256sum padloc*.AppImage > sha256sum-appimage.txt
            - name: Upload checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/appimage/sha256sum-appimage.txt
                  RELEASE_ASSET_NAME: sha256sum-tauri-appimage.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Upload deb
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/deb/*.deb
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (deb)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/tauri/src-tauri/target/release/bundle/deb
                  sha256sum *.deb > sha256sum-deb.txt
            - name: Upload checksum (deb)
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/deb/sha256sum-deb.txt
                  RELEASE_ASSET_NAME: sha256sum-tauri-deb.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Upload dmg
              if: matrix.platform == 'macos-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/dmg/*.dmg
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (dmg)
              if: matrix.platform == 'macos-latest'
              run: |
                  cd packages/tauri/src-tauri/target/release/bundle/dmg
                  sha256sum *.dmg > sha256sum-dmg.txt
            - name: Upload checksum (dmg)
              if: matrix.platform == 'macos-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/dmg/sha256sum-dmg.txt
                  RELEASE_ASSET_NAME: sha256sum-tauri-dmg.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Upload msi
              if: matrix.platform == 'windows-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/msi/*.msi
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (msi)
              if: matrix.platform == 'windows-latest'
              run: |
                  cd packages/tauri/src-tauri/target/release/bundle/msi
                  sha256sum *.msi > sha256sum-msi.txt
            - name: Upload checksum (msi)
              if: matrix.platform == 'windows-latest'
              env:
                  RELEASE_ASSET_FILE: packages/tauri/src-tauri/target/release/bundle/msi/sha256sum-msi.txt
                  RELEASE_ASSET_NAME: sha256sum-tauri-msi.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash

    release_electron:
        name: "Release Electron apps"
        environment: ${{ forgejo.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}
            PL_VENDOR_VERSION: ${{ forgejo.event.inputs.vendor_version || '0.0.1' }}

        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: ".nvmrc"
            - name: Install coreutils
              if: matrix.platform == 'macos-latest'
              run: |
                  brew install coreutils
            - name: Install Flatpak build tools
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Install Forgejo release helper
              shell: bash
              run: |
                  cat > "$RUNNER_TEMP/upload-forgejo-release-asset" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  : "${CH5_FORGEJO_API_URL:?}"
                  : "${CH5_FORGEJO_REPOSITORY:?}"
                  : "${FORGEJO_TOKEN:?}"
                  : "${RELEASE_ID:?}"
                  : "${RELEASE_ASSET_FILE:?}"

                  asset_name="${RELEASE_ASSET_NAME:-}"
                  shopt -s nullglob
                  files=()
                  for file in ${RELEASE_ASSET_FILE}; do
                      files+=("$file")
                  done
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No release asset matched: ${RELEASE_ASSET_FILE}" >&2
                      exit 1
                  fi
                  if [ -n "$asset_name" ] && [ "${#files[@]}" -ne 1 ]; then
                      echo "RELEASE_ASSET_NAME requires exactly one matched file" >&2
                      exit 1
                  fi

                  for file in "${files[@]}"; do
                      name="${asset_name:-$(basename "$file")}"
                      encoded_name=$(ASSET_NAME="$name" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')
                      assets_json=$(curl -fsS \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets")
                      asset_id=$(ASSET_NAME="$name" node -e '
                          const fs = require("fs");
                          const assets = JSON.parse(fs.readFileSync(0, "utf8"));
                          const asset = assets.find((item) => item.name === process.env.ASSET_NAME);
                          if (asset) process.stdout.write(String(asset.id));
                      ' <<<"$assets_json")
                      if [ -n "$asset_id" ]; then
                          curl -fsS --request DELETE \
                              --header "Authorization: token ${FORGEJO_TOKEN}" \
                              "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets/${asset_id}"
                      fi
                      curl -fsS --request POST \
                          --header "Authorization: token ${FORGEJO_TOKEN}" \
                          --form "attachment=@${file}" \
                          "${CH5_FORGEJO_API_URL}/repos/${CH5_FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
                  done
                  EOF
                  chmod +x "$RUNNER_TEMP/upload-forgejo-release-asset"
            - name: Build
              run: |
                  npm run electron:build
              env:
                  PL_PWA_URL: ${{ secrets.PL_PWA_URL }}
                  CSC_LINK: ${{ secrets.PL_MACOS_SIGNING_CERT_BASE64 }}
                  CSC_KEY_PASSWORD: ${{ secrets.PL_MACOS_SIGNING_CERT_PASSWORD }}
                  PL_MACOS_NOTARIZE_APPLE_ID: ${{ secrets.PL_MACOS_NOTARIZE_APPLE_ID }}
                  PL_MACOS_NOTARIZE_PASSWORD: ${{ secrets.PL_MACOS_NOTARIZE_PASSWORD }}
                  EP_PRE_RELEASE: true
            - name: Build Flatpak
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  npm run electron:build:flatpak
              env:
                  PL_PWA_URL: ${{ secrets.PL_PWA_URL }}
                  EP_PRE_RELEASE: true
            - name: Upload AppImage
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/electron/dist/*.AppImage
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.AppImage > sha256sum-appimage.txt
            - name: Upload checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/electron/dist/sha256sum-appimage.txt
                  RELEASE_ASSET_NAME: sha256sum-electron-appimage.txt
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Upload deb
              if: matrix.platform == 'ubuntu-latest'
              env:
                  RELEASE_ASSET_FILE: packages/electron/dist/*.deb
              run: '"$RUNNER_TEMP/upload-forgejo-release-asset"'
              shell: bash
            - name: Generate checksum (deb)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
