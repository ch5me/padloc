name: Update Deployments

on:
    workflow_dispatch:

env:
    CH5_FORGEJO_API_URL: ${{ github.server_url }}/api/v1

jobs:
    trigger-forgejo-action:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                instance: ["test", "beta"]
        env:
            DEPLOY_INSTANCE: ${{ matrix.instance }}
            DEVOPS_FORGEJO_REPO: ${{ secrets.DEVOPS_FORGEJO_REPO }}
            DEVOPS_FORGEJO_TOKEN: ${{ secrets.DEVOPS_FORGEJO_TOKEN }}
        steps:
            - name: Trigger Forgejo deployment workflow
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${DEVOPS_FORGEJO_REPO:-}" ] || [ -z "${DEVOPS_FORGEJO_TOKEN:-}" ]; then
                      echo "Skipping deployment update: DEVOPS_FORGEJO_REPO or DEVOPS_FORGEJO_TOKEN unset"
                      exit 0
                  fi
                  curl --fail-with-body --request POST \
                    --url "${CH5_FORGEJO_API_URL}/repos/${DEVOPS_FORGEJO_REPO}/actions/workflows/update-deployment.yml/dispatches" \
                    --header "Authorization: token ${DEVOPS_FORGEJO_TOKEN}" \
                    --header 'Content-Type: application/json' \
                    --data '{
                        "ref": "main",
                        "inputs": {
                            "instance": "${{ env.DEPLOY_INSTANCE }}",
                            "branch": "${{ github.sha }}"
                        }
                    }'
