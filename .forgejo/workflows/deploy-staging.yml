name: Deploy Staging

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - ".forgejo/workflows/deploy-staging.yml"
            - "packages/worker/**"
            - "packages/pwa/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "assets/**"
            - "config/**"
            - "scripts/**"
            - "package.json"
            - "package-lock.json"
            - "packages/*/package.json"
            - "packages/*/package-lock.json"

jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm config set fetch-retries 5
                  npm config set fetch-retry-mintimeout 20000
                  npm config set fetch-retry-maxtimeout 120000
                  npm config set fetch-timeout 600000
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Check runtime contract
              run: npm run runtime-config:check
            - name: Apply staging migrations
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run worker:migrate:staging
            - name: Deploy staging worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run worker:deploy:staging
            - name: Build staging PWA
              env:
                  PL_SERVER_URL: https://api-pad-staging.ch5.me
                  PL_PWA_URL: https://pad-staging.ch5.me
              run: npm run pwa:build
            - name: Deploy staging PWA to Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: ./node_modules/.bin/wrangler pages deploy packages/pwa/dist --project-name padloc-pwa-staging --branch main
