name: Deploy Elf Vault Staging

# Cloudflare deploy-auth: hush-in-CI (company standard).
# Staging deploys resolve the governed `ch5-padloc-staging` Cloudflare token from the
# repo's own stage-split Hush (target `wrangler-deploy-staging`) via `scripts/deploy-staging`
# — the IDENTICAL command runs on a laptop, a harness, or CI. The ONLY Cloudflare-deploy
# secret CI holds is SOPS_AGE_KEY (to unlock Hush); no Cloudflare API-token secret is used.
# Rotation = re-mint the token + push; CI picks it up with no secret edits.

on:
    workflow_dispatch:
    push:
        branches:
            - main

concurrency:
    group: padloc-staging
    cancel-in-progress: false

env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  bash scripts/ci-bootstrap-workspaces.sh
            - name: Install Playwright Chromium
              run: cd packages/extension && npx playwright install chromium --with-deps
            - name: Verify the exact staging SHA
              run: |
                  npm run prettier:check:changed
                  npm run runtime-config:check
                  npm --prefix packages/worker test
                  npm run proof:passkeys:pr

    deploy-staging:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - name: Verify current-main deploy candidate
              env:
                  EXPECTED_SHA: ${{ github.sha }}
              run: |
                  if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
                    echo "github.sha must be a full lowercase 40-character Git SHA" >&2
                    exit 2
                  fi
                  test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
                  git fetch --no-tags origin main
                  test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm config set fetch-retries 5
                  npm config set fetch-retry-mintimeout 20000
                  npm config set fetch-retry-maxtimeout 120000
                  npm config set fetch-timeout 600000
                  env -u ESBUILD_BINARY_PATH npm ci --ignore-scripts
                  bash scripts/ci-bootstrap-workspaces.sh
            - name: Setup Hush (hush-in-CI)
              run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
            - name: Deploy staging (migrations + worker + PWA via governed ch5-padloc-staging token)
              run: bash scripts/deploy-staging
              env:
                  PADLOC_DEPLOY_SHA: ${{ github.sha }}
            - name: Verify staging API, PWA, and compatibility canaries
              run: node scripts/release/deployed-canary.mjs --stage staging --sha "${{ github.sha }}" --receipt .ch5/state/staging-canary-receipt.json
            - name: Provision staging old-origin smoke identity
              run: hush run -t runtime-staging -- npm run agent:test-identity -- staging
            - name: Verify staging old-origin functional smoke
              run: hush run -t runtime-staging -- node scripts/proof-old-origin-pwa.mjs --stage staging
