name: Deploy Staging

# Cloudflare deploy-auth: hush-in-CI (company standard).
# Staging deploys resolve the governed `ch5-padloc-staging` Cloudflare token from the
# repo's own stage-split Hush (target `wrangler-deploy-staging`) via `scripts/deploy-staging`
# — the IDENTICAL command runs on a laptop, a harness, or CI. The ONLY Cloudflare-deploy
# secret CI holds is SOPS_AGE_KEY (to unlock Hush); no Cloudflare API-token secret is used.
# Rotation = re-mint the token + push; CI picks it up with no secret edits.

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - ".forgejo/workflows/deploy-staging.yml"
            - "packages/worker/**"
            - "packages/pwa/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "assets/**"
            - "config/**"
            - "scripts/**"
            - "package.json"
            - "package-lock.json"
            - "packages/*/package.json"
            - "packages/*/package-lock.json"

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: env -u ESBUILD_BINARY_PATH npm ci
            - name: Verify the exact staging SHA
              run: |
                  npm run prettier:check:changed
                  npm run runtime-config:check
                  npm --prefix packages/worker test
                  npm run proof:passkeys:pr

    deploy-staging:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm config set fetch-retries 5
                  npm config set fetch-retry-mintimeout 20000
                  npm config set fetch-retry-maxtimeout 120000
                  npm config set fetch-timeout 600000
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Setup Hush (hush-in-CI)
              run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
            - name: Deploy staging (migrations + worker + PWA via governed ch5-padloc-staging token)
              run: bash scripts/deploy-staging
            - name: Verify staging API and PWA canaries
              run: |
                  curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 https://api-pad-staging.ch5.me/healthcheck >/dev/null
                  curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 https://pad-staging.ch5.me/ >/dev/null
