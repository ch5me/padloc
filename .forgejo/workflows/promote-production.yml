name: Promote Elf Vault Production

# Cloudflare deploy-auth: hush-in-CI (company standard).
# Production deploys resolve the governed `ch5-padloc-prod` Cloudflare token from the
# repo's own stage-split Hush (target `wrangler-deploy-production`) via
# `scripts/deploy-production` — the IDENTICAL command runs on a laptop, a harness, or CI.
# The ONLY Cloudflare-deploy secret CI holds is SOPS_AGE_KEY (to unlock Hush); no
# Cloudflare API-token secret is used. Rotation = re-mint the token + push.
#
# Production is workflow_dispatch-gated on purpose: it never auto-deploys on push.
# The requested candidate must be the current main SHA and must already be live on
# staging with an exact-SHA healthcheck before production credentials are loaded.

on:
    workflow_dispatch:
        inputs:
            candidate_sha:
                description: "Full 40-character main SHA already verified on staging"
                required: true
                type: string

env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
    promote-production:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.candidate_sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Verify current-main staging candidate
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              run: |
                  node scripts/release/preflight-production.mjs \
                    --sha "$CANDIDATE_SHA" \
                    --receipt .ch5/state/staging-canary-receipt.json
            - name: Verify exact-SHA staging receipt
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              run: |
                  RECEIPT=.ch5/state/staging-canary-receipt.json EXPECTED_SHA="$CANDIDATE_SHA" node -e '
                    const fs = require("node:fs");
                    const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT, "utf8"));
                    if (
                      receipt.schema !== "elf-vault.deployed-canary-receipt.v1" ||
                      receipt.stage !== "staging" ||
                      receipt.expectedSha !== process.env.EXPECTED_SHA ||
                      receipt.apiSha !== process.env.EXPECTED_SHA ||
                      receipt.pwaSha !== process.env.EXPECTED_SHA
                    ) {
                      throw new Error(`invalid staging canary receipt for ${process.env.EXPECTED_SHA}`);
                    }
                  '
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Setup Hush (hush-in-CI)
              run: bash scripts/ci-setup-hush.sh wrangler-deploy-production
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
            - name: Deploy production (migrations + worker + PWA via governed ch5-padloc-prod token)
              run: bash scripts/deploy-production
              env:
                  PADLOC_DEPLOY_SHA: ${{ github.event.inputs.candidate_sha }}
                  PADLOC_STAGING_CANARY_RECEIPT: .ch5/state/staging-canary-receipt.json
            - name: Verify production API, PWA, and compatibility canaries
              run: node scripts/release/deployed-canary.mjs --stage production --sha "${{ github.event.inputs.candidate_sha }}" --receipt .ch5/state/production-canary-receipt.json
            - name: Provision production old-origin smoke identity
              run: hush run -t runtime-production -- npm run agent:test-identity -- production
            - name: Verify production old-origin functional smoke
              run: hush run -t runtime-production -- node scripts/proof-old-origin-pwa.mjs --stage production
