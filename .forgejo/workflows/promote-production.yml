name: Promote Production

on:
    workflow_dispatch:

jobs:
    promote-production:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Check runtime contract
              run: npm run runtime-config:check
            - name: Apply production migrations
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run worker:migrate:production
            - name: Deploy production worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run worker:deploy:production
            - name: Build production PWA
              env:
                  PL_SERVER_URL: https://api-pad.ch5.me
                  PL_PWA_URL: https://pad.ch5.me
              run: npm run pwa:build
            - name: Deploy production PWA to Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: ./node_modules/.bin/wrangler pages deploy packages/pwa/dist --project-name padloc-pwa --branch main
