name: Build Tauri

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                default: "Local"

jobs:
    build:
        environment: ${{ github.event.inputs.environment || 'Local' }}

        strategy:
            fail-fast: false
            matrix:
                config:
                    - os: ubuntu-latest
                      arch: x86_64
                      rust_target: x86_64-unknown-linux-gnu
                    - os: macos-arm64
                      arch: x86_64
                      rust_target: x86_64-apple-darwin
                    - os: macos-arm64
                      arch: aarch64
                      rust_target: aarch64-apple-darwin
                    - os: windows-latest
                      arch: x86_64
                      rust_target: x86_64-pc-windows-msvc

        runs-on: ${{ matrix.config.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: "Setup Rust"
              shell: bash
              run: |
                  set -euo pipefail
                  curl -fsSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
                  cargo_bin="$HOME/.cargo/bin"
                  path_file="${FORGEJO_PATH:-${GITHUB_PATH:-}}"
                  if [ -n "$path_file" ]; then
                      echo "$cargo_bin" >> "$path_file"
                  fi
                  export PATH="$cargo_bin:$PATH"
                  rustup target add "${{ matrix.config.rust_target }}"
                  rustc --version
                  cargo --version
            - name: Install webkit2gtk (ubuntu only)
              if: matrix.config.os == 'ubuntu-latest'
              run: |
                  scripts/ci-apt-install.sh webkit2gtk-4.0
            - name: Install dependencies
              run: |
                  env -u ESBUILD_BINARY_PATH npm ci
            - name: Build (debug)
              if: github.event.inputs.environment != 'Production'
              run: npm run tauri:build:debug
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
            - name: Build (production)
              if: github.event.inputs.environment == 'Production'
              run: npm run tauri:build
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
            - name: Archive AppImage
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'ubuntu-latest'
              with:
                  name: padloc-linux-${{ github.sha }}-unsigned.AppImage
                  path: packages/tauri/src-tauri/target/debug/bundle/appimage/padloc*.AppImage
                  if-no-files-found: error
            - name: Archive deb
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'ubuntu-latest'
              with:
                  name: padloc-linux-${{ github.sha }}-unsigned.deb
                  path: packages/tauri/src-tauri/target/debug/bundle/deb/*.deb
                  if-no-files-found: error
            - name: Archive dmg
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'macos-arm64'
              with:
                  name: padloc-macos-${{ matrix.config.arch }}-${{ github.sha }}-unsigned.dmg
                  path: packages/tauri/src-tauri/target/debug/bundle/dmg/*.dmg
                  if-no-files-found: error
            - name: Archive app
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'macos-arm64'
              with:
                  name: padloc-macos-${{ matrix.config.arch }}-${{ github.sha }}-unsigned.app
                  path: packages/tauri/src-tauri/target/debug/bundle/macos/*.app
                  if-no-files-found: error
            - name: Archive msi
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'windows-latest'
              with:
                  name: padloc-windows-${{ github.sha }}-unsigned.msi
                  path: packages/tauri/src-tauri/target/debug/bundle/msi/*.msi
                  if-no-files-found: error
