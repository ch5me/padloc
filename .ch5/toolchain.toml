schemaVersion = 1

[repo]
id = "padloc"
kind = "node-app"
packageManager = "npm"
lockfiles = ["package-lock.json", "package.json", "packages/admin/package-lock.json", "packages/app/package-lock.json", "packages/cordova/package-lock.json", "packages/core/package-lock.json", "packages/electron/package-lock.json", "packages/extension/package-lock.json", "packages/pwa/package-lock.json", "packages/server/package-lock.json", "packages/tauri/package-lock.json", "packages/worker/package-lock.json"]

[[verify]]
name = "repository structure: package.json"
command = "test -f package.json"

[[verify]]
name = "native build Python"
command = "bash scripts/check-native-build-python.sh"

[deps]
install = "npm ci --ignore-scripts && bash scripts/ci-bootstrap-workspaces.sh"

[warm]
command = "npm ci --ignore-scripts && bash scripts/ci-bootstrap-workspaces.sh"

[[hushTarget]]
target = "runtime"
root = "project"
exports = ["NPM_TOKEN"]
requiredFor = ["install"]
